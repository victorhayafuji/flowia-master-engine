name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check packages apps/salon tests main.py

      - name: Bandit SAST (fail on Medium+)
        # -ll reporta/falha em Medium+ (exit!=0). 2 FPs B608 (DELETE de nome de tabela
        # literal, sem input de usuário) suprimidos via `# nosec B608` na fonte.
        run: bandit -r packages apps -ll

      - name: pip-audit (supply-chain)
        # Ignores = dívida rastreada (degrau-3-fase-2): bump do core LLM exige regressão
        # completa do motor (booking/RAG/triage) e vira onda dedicada.
        #   langgraph-checkpoint 2.x  -> CVE-2025-64439 / CVE-2026-27794 / CVE-2026-48775
        #   langchain <1.3 (fix 1.3.9 arrasta checkpoint 4.x) -> GHSA-gr75-jv2w-4656
        #   langchain-openai <1.0 -> PYSEC-2026-76
        #   pytest <9 (dev-only; 9.x regride pytest-asyncio) -> CVE-2025-71176
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2025-64439 \
            --ignore-vuln CVE-2026-27794 \
            --ignore-vuln CVE-2026-48775 \
            --ignore-vuln GHSA-gr75-jv2w-4656 \
            --ignore-vuln PYSEC-2026-76 \
            --ignore-vuln CVE-2025-71176

      - name: Tenant-scoped writes guard
        run: python scripts/check_tenant_scoped_writes.py

      - name: Run tests with coverage
        env:
          OPENAI_API_KEY: test-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE: test-service-role
          SUPABASE_DB_URL: postgresql://postgres:pass@localhost:5432/postgres
          WHATSAPP_VERIFY_TOKEN: test-verify-token
          DASHBOARD_API_KEY: test-dashboard-api-key
          DASHBOARD_JWT_SECRET: test-jwt-secret-for-ci-only-32chars
          CHECKPOINTER_BACKEND: memory
          SCHEDULER_ENABLED: false
        run: pytest -m "not llm_behavior" --cov=packages --cov=apps/salon --cov-report=term-missing --cov-fail-under=50

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/salon/dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/salon/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_KEY: test-anon-key
          VITE_API_URL: http://localhost:8000/api/v1
        run: npm run build

  e2e-scheduling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/salon/dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/salon/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E auth, agenda, chat scheduling (mock API)
        run: npm run test:e2e -- e2e/auth-nav.spec.ts e2e/agenda.spec.ts e2e/chat-test-scheduling.spec.ts
