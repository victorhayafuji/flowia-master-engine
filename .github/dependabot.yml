version: 2
# Atualizações AGRUPADAS e MENSAIS — desenhado para baixo ruído de PRs.
# - Minor/patch chegam juntos numa única PR por ecossistema, 1x/mês.
# - Majors NÃO são automáticos em pip/npm (só sob demanda, em onda dedicada);
#   risco de CVE já é coberto por pip-audit + bandit no CI.
# - GitHub Actions agrupa tudo numa PR (majors de actions são baixo risco).
# - Core LLM congelado (degrau 3 fase-2): sem minor também.
updates:
  # Backend Python deps (raiz)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors nunca automáticos — abrir sob demanda em onda dedicada.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Core LLM congelado: também sem minor (bump arrasta o motor LangGraph).
      - dependency-name: "langchain"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "langchain-openai"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "langgraph-checkpoint"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "langgraph-checkpoint-postgres"
        update-types: ["version-update:semver-minor"]

  # Frontend npm deps (dashboard)
  - package-ecosystem: "npm"
    directory: "/apps/salon/dashboard"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors nunca automáticos (React 19, TS 6, ESLint 10 = ondas próprias).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions (majors são baixo risco; agrupa tudo numa PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns: ["*"]
